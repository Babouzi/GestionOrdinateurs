name: CI/CD Docker ALTN71 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_ACCOUNT }}

jobs:

  tests:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v5
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
  
      - name: Restore
        run: dotnet restore
  
      - name: Build solution
        run: dotnet build --no-restore
  
      # Exécute tous les tests de la solution automatiquement
      - name: Run tests
        run: dotnet test --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: tests
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        
      - name: Afficher l'arborescence
        run: |
         pwd
         ls -la
         find . -name Dockerfile
    
      #################################################
      # AuthentificationApi
      #################################################
      - name: Build AuthentificationApi
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/authentificationapi:latest -f AuthentificationApi/Dockerfile .

      - name: Push AuthentificationApi
        run: docker push ${{ env.DOCKER_REGISTRY }}/authentificationapi:latest
        
      #################################################
      # GestionOrdinateurs.API
      #################################################
      - name: Build GestionOrdinateursApi
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/gestionordinateursapi:latest -f GestionOrdinateurs.API/Dockerfile .

      - name: Push GestionOrdinateursApi
        run: docker push ${{ env.DOCKER_REGISTRY }}/gestionordinateursapi:latest

      #################################################
      # GestionOrdinateurs.Gateway
      #################################################
      - name: Build Gateway
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/gateway:latest -f GestionOrdinateurs.Gateway/Dockerfile .

      - name: Push Gateway
        run: docker push ${{ env.DOCKER_REGISTRY }}/gateway:latest

      #################################################
      # GestionOrdinateurs.Client 
      #################################################
      - name: Build Blazor Client
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/gestionordinateursclient:latest -f GestionOrdinateurs.Client/Dockerfile .

      - name: Push Blazor Client
        run: docker push ${{ env.DOCKER_REGISTRY }}/gestionordinateursclient:latest